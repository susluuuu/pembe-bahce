<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#170e16"><title>Pembe Bahçe | Küçük Bir Sürpriz</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#ffe8f0;background:radial-gradient(ellipse at 75% 40%,#482338 0%,#241321 42%,#100b12 100%);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#ffd8e6 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,black,transparent)}
.wrap{min-height:100vh;max-width:1200px;margin:auto;padding:28px 5vw 40px;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:13px;border-bottom:1px solid #d78aa64d;padding-bottom:17px;color:#f3b5cb;font-style:italic;font-size:clamp(20px,3vw,27px);letter-spacing:.4px}
.flower-mark{font-style:normal;font-size:27px}
main{flex:1;display:grid;grid-template-columns:.85fr 1.4fr;align-items:center;gap:20px}
.copy{z-index:1;padding:24px 0}.eyebrow{color:#e9a2bd;text-transform:uppercase;letter-spacing:4px;font:11px Arial,sans-serif}
h1{font-size:clamp(38px,6vw,67px);line-height:1.06;font-weight:400;font-style:italic;margin:18px 0;color:#ffe5ee;text-shadow:0 0 25px #f18caf55}
.sub{color:#d9b5c3;font:15px/1.8 Arial,sans-serif;max-width:330px;margin:0 0 30px}
button{border:1px solid #ffc2d7;border-radius:50px;padding:17px 34px;background:linear-gradient(135deg,#f6a6c2,#c75d89);color:#fff;font:17px Georgia,serif;cursor:pointer;box-shadow:0 0 22px #e87da877,inset 0 1px #ffffff80;transition:transform .25s,box-shadow .25s}
button:hover{transform:translateY(-3px);box-shadow:0 0 34px #f28eb5aa}button:focus-visible{outline:3px solid white;outline-offset:4px}
#gift{display:none;animation:appear 1s cubic-bezier(.2,.8,.2,1) both}#gift.show{display:block}
#gift img{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 35px #0009);border-radius:12px;mix-blend-mode:screen}
.message{display:none;text-align:center;color:#f8c7d8;font-size:clamp(20px,3vw,28px);font-style:italic;margin-top:-3px;animation:appear 1s .35s both}.message.show{display:block}
footer{text-align:center;color:#bd8da1;font-size:14px;font-style:italic;padding-top:18px}
.petal{position:fixed;top:-30px;color:#eaa0b9;opacity:.5;pointer-events:none;animation:fall linear infinite}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translate3d(80px,110vh,0) rotate(360deg)}}
@media(max-width:720px){.wrap{padding:22px 22px 28px}main{grid-template-columns:1fr;gap:0;align-content:center}.copy{text-align:center;padding:42px 0 8px}.sub{margin:0 auto 25px}#gift{max-width:560px;margin:0 auto}#gift img{max-height:48vh;object-fit:contain}footer{padding-top:12px}}

.reveal-button{display:inline-block;border:1px solid #ffc2d7;border-radius:50px;padding:17px 34px;
background:linear-gradient(135deg,#f6a6c2,#c75d89);color:#fff;font:17px Georgia,serif;cursor:pointer;
box-shadow:0 0 22px #e87da877,inset 0 1px #ffffff80;transition:transform .25s,box-shadow .25s}
.reveal-button:hover{transform:translateY(-3px);box-shadow:0 0 34px #f28eb5aa}
#reveal-toggle:focus-visible+.wrap main .reveal-button{outline:3px solid white;outline-offset:4px}
#reveal-toggle:checked~main #gift{display:block}
#reveal-toggle:checked~main .message{display:block}
#reveal-toggle:checked~main .reveal-button{display:none}
#reveal-toggle:checked~main #intro{display:none}
#reveal-toggle:checked~main #headline{font-size:clamp(34px,5vw,56px)}

</style></head>
